<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="tailwind.css" />
  </head>
  <body>
    <div id="container" class="w-full max-w-[430px] mx-[auto] bg-red-100">
      <div id="icons"></div>
      <div id="profile" class="flex mx-6">
        <img
          class="w-[125px] h-[150px] object-cover rounded-xl"
          src="https://cobasiblog.blob.core.windows.net/production-ofc/2021/05/hamster-mordendo-topo.png"
          alt="Hamster Lindo"
        />
        <ul class="mt-11 ml-7">
          <li>Seu Hamster</li>
          <li>+55 11 4002-8922</li>
          <li>Motorista</li>
        </ul>
      </div>

      <div id="selecao" class="overflow-x-auto p-[35px_0px_20px_24px] flex">
        <div class="pr-[8px]" >
          <input type="radio" id="opcao1" class="hidden peer" name="meu_grupo" value="config" onclick="showRideRequest()" checked/>
          <label for="opcao1" class="peer-checked:[&>span]:text-white peer-checked:[&>span]:font-bold peer-checked:bg-purple-500 button relative flex-[0_0_auto] w-[100px] h-[100px] bg-none border-none p-0 cursor-pointer rounded-[8px] overflow-hidden block [&>span]:text-black">
            <img
            class="w-12 h-12 absolute top-4 left-1/2 -translate-x-1/2 object-contain"
            src="/media/car.png"
            alt=""
            />
            <span class="absolute bottom-[0px] left-[0px] right-[0px] text-white p-[30px_10px_10px_10px] text-[14px] font-bold text-left text-center">Ride</span>
          </label>
        </div>

        <div class="px-[8px]">
          <input type="radio" id="opcao2" class="hidden peer" name="meu_grupo" value="user"/>
          <label for="opcao2" class="button relative flex-[0_0_auto] w-[100px] h-[100px] peer-checked:bg-purple-500 bg-none border-none p-0 cursor-pointer rounded-[8px] overflow-hidden text-black peer-checked:[&>span]:text-white peer-checked:[&>span]:font-bold block font-bold">
            <img
            class="w-11 h-11 absolute top-4 left-1/2 -translate-x-1/2 object-contain"
            src="/media/envelope-de-correio-fechado.png"
            alt=""
            />
            <span class="absolute bottom-[0px] left-[0px] right-[0px]  p-[30px_10px_10px_10px] text-[14px] text-center">Message</span>
          </label>
        </div>

        <div class="px-[8px]">
          <input type="radio" id="opcao3" class="hidden peer" name="meu_grupo" value="config"/>
          <label for="opcao3" class="peer-checked:[&>span]:text-white peer-checked:[&>span]:font-bold [&>span]:text-black peer-checked:bg-purple-500 button relative flex-[0_0_auto] w-[100px] h-[100px] bg-none border-none p-0 cursor-pointer rounded-[8px] overflow-hidden block">
            <img
            class="w-10 h-10 absolute top-4 left-1/2 -translate-x-1/2 object-contain"
            src="/media/coracao.png"
            alt=""
            />
            <span class="absolute bottom-[0px] left-[0px] right-[0px] text-white p-[30px_10px_10px_10px] text-[14px] font-bold text-center">Rating</span>
          </label>
        </div>

        <div class="pl-[8px]">
          <input type="radio" id="opcao4" class="hidden peer" name="meu_grupo" value="config"/>
          <label for="opcao4" class="peer-checked:[&>span]:text-white peer-checked:[&>span]:font-bold peer-checked:bg-purple-500 [&>span]:text-black button relative flex-[0_0_auto] w-[100px] h-[100px] bg-none border-none p-0 cursor-pointer rounded-[8px] overflow-hidden block">
            <img
            class="w-10 h-10 absolute top-4 left-1/2 -translate-x-1/2 object-contain"
            src="/media/simbolo-de-tres-barras-verticais-delineadas.png"
            alt=""
            />
            <span class="absolute bottom-[0px] left-[0px] right-[0px] text-white p-[30px_10px_10px_10px] text-[14px] font-bold text-center">My feed</span>
          </label>
        </div>
        
      </div>

      <div id="ride" class="p-[20px_0px_0px_24px] [&>span]:text-black dark:[&>span]:text-white">
        <p>New ride request!</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
